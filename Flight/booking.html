<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking details</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/detailsStyle.css">
    <link rel="stylesheet" href="css/booking.css">
</head>

<body>
    <header class="top-nav bg-white shadow-sm">
        <div class="Fcontainer nav-inner d-flex align-items-center justify-content-between">

            <nav class="d-flex align-items-center h-100 gap-9">
                <a href="#"
                    class="nav-item-link active d-flex align-items-center gap-2 h-100 text-sm fw-semibold text-decoration-none">
                    <i class="fa-solid fa-plane"></i> Find Flight
                </a>
                <a href="#"
                    class="nav-item-link d-flex align-items-center gap-2 h-100 text-sm fw-semibold text-decoration-none">
                    <i class="fa-solid fa-bed"></i> Find Stays
                </a>
            </nav>


            <a href="#" class="logo"><img src="images/logo.png" alt="" class="img-fluid"></a>

            <div class="d-flex align-items-center gap-4">
                <a href="#"
                    class="nav-item-link d-flex align-items-center gap-2 text-sm fw-semibold text-decoration-none">
                    <i class="fa-solid fa-heart"></i> Favourites
                </a>
                <span>|</span>
                <a href="#"
                    class="nav-item-link d-flex align-items-center gap-2 text-sm fw-semibold text-decoration-none">

                    <img src="images/user.png" alt="" class="user-img rounded-circle object-fit-cover">
                    John D.
                </a>
            </div>
        </div>
    </header>

    <nav class="Fcontainer d-flex align-items-center gap-3 text-sm pt-12 pb-9">
        <a href="#" class="text-orange text-decoration-none">Turkey</a>
        <i class="fa-solid fa-chevron-right"></i>

        <a href="#" class="text-orange text-decoration-none">Istanbul</a>
        <i class="fa-solid fa-chevron-right"></i>

        <span>CVK Park Bosphorus Hotel Istanbul</span>
    </nav>

    <main class="Fcontainer">
        <section class="row gx-12">
            <div class="col-7">

                <div class="bg-white rounded-5 shadow-sm p-7 mb-11">
                    <div class="d-flex justify-content-between">

                        <h1 class="fs-24 fw-bold mb-5">Emirates A380 Airbus</h1>
                        <h2 class="text-orange fs-32 fw-bold mb-7">$240</h2>
                    </div>

                    <div class="d-flex justify-content-between mb-5">
                        <h4 class="fs-md fw-semibold mb-0">Return Wed, Dec 8</h4>
                        <span class="fs-md text-gray">2h 28m</span>
                    </div>

                    <div class="d-flex justify-content-between align-items-center">
                        <div class="box2 border border-mint rounded-3 d-flex align-items-center gap-5 px-9 py-4">
                            <img src="images/dubai.png" alt="" class="airline-logo">
                            <div>
                                <h5 class="fs-24 fw-bold mb-0">Emirates</h5>
                                <small class="text-gray text-sm">Airbus A320</small>
                            </div>
                        </div>


                        <div class="d-flex fs-lg">
                            <span class="px-6"><i class="fa-solid fa-plane"></i></span>
                            <span class="px-6 border-start"><i class="fa-solid fa-wifi"></i></span>
                            <span class="px-6 border-start"><i class="fa-solid fa-stopwatch"></i></span>
                            <span class="px-6 border-start"><i class="fa-solid fa-mug-saucer"></i></span>
                            <span class="px-6 border-start"><i class="fa-solid fa-wheelchair"></i></span>
                        </div>
                    </div>

                    <div class=" d-flex justify-content-center align-items-center gap-8 pt-9 pb-3">
                        <span class="fs-24 fw-semibold">12:00 pm</span>
                        <span class="text-md text-gray">Newark(EWR)</span>
                        <span class="line"></span>
                        <i class="fa-solid fa-plane fs-3xl"></i>
                        <span class="line"></span>
                        <span class="fs-24 fw-semibold">12:00 pm</span>
                        <span class="text-md text-gray">Newark(EWR)</span>
                    </div>

                </div>
            </div>

            <!--Economy card -->
            <div class="col-5">

                <div class="card card-row border border-0 bg-white fg-black shadow-sm" style="max-width: 540px;">
                    <img src="images/plane.png" class="card-img-start" alt="">
                    <div class="card-body  ">
                        <h5 class="text-gray">Economy</h5>
                        <h4 class="card-title">Emirates A380 Airbus</h4>
                        <p class="card-text">
                        <div class="d-flex align-items-center gap-2">
                            <span class="border border-mint rounded-3 px-3 py-1 text-xs">4.2</span>
                            <span class="text-xs"> <b>Very Good</b> 54 reviews</span>
                        </div>
                        </p>
                     
                    </div>
                </div>
            </div>
        </section>
    </main>

</body>

</html>
